[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bitwarden-menu"
dynamic = ["version"]
description = "Dmenu/Rofi frontend for Bitwarden CLI tool"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Scott Hansen", email = "tech@firecat53.net" },
]
keywords = [
    "bitwarden",
    "bitwarden-menu",
    "bwm",
    "dmenu",
    "rofi",
    "wmenu",
    "wofi",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]
dependencies = [
    "xdg-base-dirs",
]

[project.optional-dependencies]
autotype = [
    "pynput",
]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
bwm = "bwm.__main__:main"

[project.urls]
Homepage = "https://github.com/firecat53/bitwarden-menu"

[tool.hatch.version]
path = "bwm/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["/bwm"]

[tool.hatch.build.targets.wheel.shared-data]
LICENSE = "share/doc/bitwarden-menu/LICENSE"
"README.md" = "share/doc/bitwarden-menu/README.md"
"config.ini.example" = "share/doc/bitwarden-menu/config.ini.example"
docs = "share/doc/bitwarden-menu/docs"
"bwm.1" = "share/man/man1/bwm.1"

[tool.hatch.build.targets.sdist]
include = [
    "/bwm",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["bwm"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
